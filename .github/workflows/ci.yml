name: Build and test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libeigen3-dev g++ pkg-config
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja eigen pkg-config
      - name: Configure
        run: meson setup build --buildtype=debugoptimized
      - name: Compile
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
      - name: Installed consumer
        run: ./tests/check-installed-consumer.sh
