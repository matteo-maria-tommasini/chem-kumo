name: Build and test

on:
  push:
  pull_request:

jobs:
  test:
    # The sanitizer entry gets its own name; the others keep "test (<os>)".
    name: ${{ matrix.sanitize && format('sanitizers ({0})', matrix.os) || format('test ({0})', matrix.os) }}
    runs-on: ${{ matrix.os }}
    # A normal run takes about 5 minutes; fail stuck jobs instead of
    # letting them hang for the 6-hour GitHub default.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitize: [false]
        # AddressSanitizer and UndefinedBehaviorSanitizer (GCC on Ubuntu):
        # memory errors such as use-after-free and undefined behaviour abort
        # the test that triggers them (meson test sets halt_on_error=1).
        include:
          - os: ubuntu-latest
            sanitize: true
    steps:
      - uses: actions/checkout@v4
      # Package mirrors and DNS on hosted runners occasionally fail for a few
      # minutes. Each attempt is time-limited, because an unreachable mirror
      # can stall apt for many minutes; then the whole install is retried.
      # Only the network phases (index update and package download) are
      # time-limited: the final install runs offline from the apt cache, so
      # dpkg is never killed halfway through.
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          packages=(meson ninja-build libeigen3-dev zlib1g-dev g++ pkg-config)
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update &&
               sudo timeout 180 apt-get install -y --no-install-recommends --download-only "${packages[@]}" &&
               sudo apt-get install -y --no-install-recommends --no-download "${packages[@]}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::apt install failed (attempt $attempt of 3); retrying in $((attempt * 30)) s"
              sleep $((attempt * 30))
            fi
          done
          echo "::error::apt install failed after 3 attempts"
          exit 1
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 20
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          for attempt in 1 2 3; do
            if brew install meson ninja eigen pkg-config; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::brew install failed (attempt $attempt of 3); retrying in $((attempt * 60)) s"
              sleep $((attempt * 60))
            fi
          done
          echo "::error::brew install failed after 3 attempts"
          exit 1
      # Compiler warnings fail the build (GCC on Ubuntu, Clang on macOS), so
      # that a new warning is caught here rather than by users. Warnings
      # inside Eigen's headers are not reported (it is a system include).
      # The benchmarks are compiled too (not run), so that an API change
      # cannot leave them broken.
      - name: Configure
        if: ${{ !matrix.sanitize }}
        run: meson setup build --buildtype=debugoptimized -Dwerror=true -Dbenchmarks=true
      # Warnings are checked by the other jobs. Sanitizer instrumentation can
      # make GCC report extra false-positive warnings, so they do not fail here.
      - name: Configure (sanitizers)
        if: ${{ matrix.sanitize }}
        run: >-
          meson setup build --buildtype=debugoptimized
          -Db_sanitize=address,undefined -Db_lundef=false
      - name: Compile
        run: meson compile -C build
      # Sanitizer builds run several times slower, so the per-test limits are
      # multiplied by 5 there. The 'slow' suite (screening tests on the large
      # HBC molecule) took 6 to over 10 minutes under GCC sanitizers on hosted
      # runners; the sanitizer job skips it, the other jobs run it.
      - name: Test
        run: >-
          meson test -C build --print-errorlogs
          ${{ matrix.sanitize && '--timeout-multiplier 5 --no-suite slow' || '' }}
      - name: Installed consumer
        if: ${{ !matrix.sanitize }}
        run: ./tests/check-installed-consumer.sh
